<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro SOAP</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <!-- Barra de navegación -->
    <nav>
        <div class="navbar">
            <div class="logo">
                <a href="index.html">3D Model Shop</a>
            </div>
            <div class="nav-links">
                <ul>
                    <li><a href="catalog.html" class="nav-link">Add</a></li>
                    <li id="course-status-link"></li>
                    <li id="login-register-link">
                        <a href="login.html">Login</a> / <span id="course-status">Course...</span>
                    </li>
                    <li id="user-settings" style="display: none;">
                        <span id="settings-icon">&#9881;</span>
                        <div id="settings-dropdown" class="dropdown">
                            <a href="profile.html">Profile</a>
                            <a href="#" id="logout-link">Logout</a>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="form-container">
        <h2>Registro de Usuario (SOAP)</h2>
        <form id="registerForm">
            <label for="username">Usuario:</label>
            <input type="text" id="username" required><br>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" required><br>

            <label for="first_name">Nombre:</label>
            <input type="text" id="first_name" required><br>

            <label for="last_name">Apellido:</label>
            <input type="text" id="last_name" required><br>

            <label for="dni">DNI:</label>
            <input type="text" id="dni" required><br>

            <label for="email">Email:</label>
            <input type="email" id="email" required><br>

            <label for="city">Ciudad:</label>
            <input type="text" id="city" required><br>

            <button type="submit">Registrar</button>
        </form>
        <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 3D Model Shop. Todos los derechos reservados.</p>
    </footer>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const first_name = document.getElementById("first_name").value;
            const last_name = document.getElementById("last_name").value;
            const dni = document.getElementById("dni").value;
            const email = document.getElementById("email").value;
            const city = document.getElementById("city").value;

            // Construir el mensaje SOAP
            const soapRequest = `
                <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:user="http://example.com/user">
                    <soapenv:Header/>
                    <soapenv:Body>
                        <user:RegisterUser>
                            <user:username>${username}</user:username>
                            <user:password>${password}</user:password>
                            <user:first_name>${first_name}</user:first_name>
                            <user:last_name>${last_name}</user:last_name>
                            <user:dni>${dni}</user:dni>
                            <user:email>${email}</user:email>
                            <user:city>${city}</user:city>
                        </user:RegisterUser>
                    </soapenv:Body>
                </soapenv:Envelope>
            `;

            try {
                const response = await fetch("http://localhost:5002/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/xml"
                    },
                    body: soapRequest
                });

                const responseText = await response.text();
                console.log("Respuesta SOAP:", responseText);

                if (response.ok) {
                    alert("Usuario registrado exitosamente");
                    window.location.href = "login.html";
                } else {
                    alert("Error en el registro: " + responseText);
                }
            } catch (error) {
                console.error("Error en el registro:", error);
                alert("Hubo un error al registrar el usuario");
            }
        });
    </script>

</body>
</html>
